  const L = { armL: arm(-1), armR: arm(1), legL: leg(-1), legR: leg(1), hip, torso, head, root, mode: o.mode, path: o.path, t: Math.random() * 6 };
  return L;
}
const people = [
  person({ p: [4.5, 0, 6.8], ry: .5, shirt: '#e8ecef', jacket: '#4a4f57', tie: '#b8322a', pants: '#3a3f47', hair: 'bald', hairC: '#9a9aa0', glasses: true, brow: '#7d7d82', mode: 'walk', path: { cx: 5.8, cz: 6.4, r: 2.2 } }),
  person({ p: [3.15, 0, 2.45], ry: 0, shirt: '#f4f6f8', tie: '#2b5c9e', badge: true, pants: '#2f3540', hairC: '#2a211b', mode: 'type' }),
  person({ p: [4.85, 0, 4.75], ry: Math.PI, shirt: '#c9d8e6', sleeves: 'short', pants: '#7a6a58', hair: 'bun', hairC: '#5a3b28', skin: '#d9a07a', mode: 'type' }),
  person({ p: [8.85, 0, 2.45], ry: 0, shirt: '#f7e3c8', pants: '#3d4a54', badge: true, hairC: '#3a2a20', skin: '#c98d6a', mode: 'type' }),
  person({ p: [8.2, 0, 6.1], ry: -1.0, shirt: '#e98a5a', apron: '#4f7c99', pants: '#4b555d', hair: 'scarf', hairC: '#cf6f8a', skin: '#e2ae8a', shoes: '#f2efe9', mode: 'idle' }),
  person({ p: [.55, 0, .5], ry: .8, shirt: '#ffffff', jacket: '#2b3a55', tie: '#d9a441', pants: '#2b3a55', hairC: '#1d1a18', mode: 'idle' }),
];

/* ?view=cast: everyone in a row in front of the cubicles */
if (view === 'cast') {
  people.forEach((P, i) => { P.mode = 'idle'; P.root.position.set(3.05 + i * .95, 0, 7.6); P.root.rotation.y = 0; });
  cam.position.set(5.45, 1.8, 14.2); cam.lookAt(5.45, .9, 7.6); cam.fov = 34; cam.updateProjectionMatrix();
}
/* ---------- procedural animation: walk loop, typing, idle breathing ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  for (const P of people) {
    P.t += dt; const t = P.t;
    if (P.mode === 'walk') {
      const a = t * .55, { cx, cz, r } = P.path;
      P.root.position.set(cx + Math.cos(a) * r, 0, cz + Math.sin(a) * r * .6); P.root.rotation.y = Math.atan2(-Math.sin(a) * r, Math.cos(a) * r * .6);
      const s = Math.sin(t * 7);
      P.legL.th.rotation.x = s * .55; P.legR.th.rotation.x = -s * .55; P.legL.kn.rotation.x = Math.max(0, -s) * .7; P.legR.kn.rotation.x = Math.max(0, s) * .7;
      P.armL.up.rotation.x = -s * .45; P.armR.up.rotation.x = s * .45; P.armL.el.rotation.x = P.armR.el.rotation.x = -.25;
      P.hip.position.y = .92 + Math.abs(Math.cos(t * 7)) * .035; P.torso.rotation.y = s * .08;
    } else if (P.mode === 'type') {
      P.hip.position.y = .52; P.legL.th.rotation.x = P.legR.th.rotation.x = -1.45; P.legL.kn.rotation.x = P.legR.kn.rotation.x = 1.45;
      P.armL.up.rotation.x = P.armR.up.rotation.x = -.9; P.armL.el.rotation.x = -.7 + Math.sin(t * 18) * .06; P.armR.el.rotation.x = -.7 + Math.sin(t * 18 + 1.7) * .06;
      P.head.rotation.x = .12 + Math.sin(t * .7) * .03; P.torso.rotation.x = .1;
    } else {
      P.torso.position.y = .1 + Math.sin(t * 2) * .006; P.head.rotation.y = Math.sin(t * .6) * .25;
      P.armL.up.rotation.z = -.06; P.armR.up.rotation.z = .06; P.armR.el.rotation.x = -.15;
    }
  }
  R.render(scene, cam); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
