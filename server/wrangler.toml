# Cloudflare Worker for online play: serves public/ and runs one Durable Object per room.
name = "office-royale"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Bundle the rule files into src/sim.gen.js before every dev/deploy.
[build]
command = "node ../tools/build-server.mjs"
watch_dir = "../public/js/sim"

# The game itself, served from the same origin so the client can open /room/CODE.
[assets]
directory = "../public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 성과 are open (career.js AWARDS_ON). TEST_TOOLS stays off here: the test server passes it with --var.
[vars]
AWARDS = "1"

# Free plan: Durable Objects must use the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
